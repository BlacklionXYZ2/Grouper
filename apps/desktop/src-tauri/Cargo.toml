[workspace]

[package]
name = "grouper-desktop"
description = "Grouper Windows desktop shell (Tauri 2): embedded local hub and device node"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
default-run = "grouper-desktop"

[[bin]]
name = "grouper-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
core-client = { path = "../../../crates/core-client" }
dirs = "6"
hub = { path = "../../../crates/hub" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
