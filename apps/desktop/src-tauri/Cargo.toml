[workspace]

[package]
name = "grouper-desktop"
description = "Grouper Windows desktop shell (Tauri 2): embedded local hub and device node"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
default-run = "grouper-desktop"

[[bin]]
name = "grouper-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
core-client = { path = "../../../crates/core-client" }
dirs = "6"
getrandom = "0.4"
hex = "0.4"
hub = { path = "../../../crates/hub" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
