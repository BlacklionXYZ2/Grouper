<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where should Grouper run?</title>
  <style>
    /* Grouper design system (docs/design-system/design-system.md): navy base, teal action,
       four text tiers, hairlines, system fonts. This page is bundled with the app and
       shown before any hub exists, so the tokens are copied here, not linked. */
    :root {
      color-scheme: light dark;
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --surface-2: #EEF2F6;
      --text: #0F1722;
      --text-2: #39434F;
      --text-3: #4C5663;
      --line-2: rgb(15 23 34 / 0.14);
      --border-control: #78828F;
      --accent: #0B7372;
      --accent-fill: #12C4BF;
      --accent-fill-edge: #0B8A86;
      --accent-ink: #06262A;
      --focus: #1A73E8;
      --danger: #B42318;
      --shadow-sm: 0 0 0 1px rgb(15 23 34 / 0.04), 0 2px 8px rgb(15 23 34 / 0.04);
      --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141D;
        --surface: #171C25;
        --surface-2: #1D222C;
        --text: #F3F6F9;
        --text-2: #C5CFDC;
        --text-3: #A4ADBB;
        --line-2: rgb(214 226 245 / 0.08);
        --border-control: #656F7E;
        --accent: #22D3CE;
        --accent-fill-edge: #12C4BF;
        --focus: #7CB4FF;
        --danger: #F87171;
        --shadow-sm: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 400 15px/22px system-ui, "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif;
      letter-spacing: -0.1px;
    }
    main {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 24px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      line-height: 26px;
      font-weight: 600;
      letter-spacing: -0.25px;
    }
    p.lead {
      margin: 0 0 20px;
      color: var(--text-3);
      font-size: 13.5px;
      line-height: 18px;
    }
    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 16px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 120ms var(--ease-out), background-color 120ms var(--ease-out);
    }
    .option:hover { background: var(--surface-2); }
    .option:has(input:checked) {
      border-color: var(--accent);
      outline: 1px solid var(--accent);
    }
    .option input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--accent-fill-edge);
    }
    .option-title {
      font-size: 13.5px;
      line-height: 18px;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }
    .option-desc {
      color: var(--text-3);
      font-size: 12.5px;
      line-height: 16px;
      display: block;
    }
    .remote-box {
      margin: 4px 0 12px;
      padding: 12px 16px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
    }
    .remote-box[hidden] { display: none; }
    .remote-box label {
      display: block;
      font-size: 12.5px;
      line-height: 16px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .remote-box input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-control);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
    }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .hint {
      margin: 4px 0 0;
      color: var(--text-3);
      font-size: 12.5px;
      line-height: 16px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    button {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 60ms var(--ease-out), opacity 60ms var(--ease-out);
    }
    button.primary {
      background: var(--accent-fill);
      border-color: var(--accent-fill-edge);
      color: var(--accent-ink);
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border-control);
    }
    button.secondary:hover { background: var(--surface-2); }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #error {
      margin-top: 12px;
      color: var(--danger);
      font-size: 12.5px;
      line-height: 16px;
    }
    #oauth-note {
      margin-top: 16px;
      color: var(--text-3);
      font-size: 12.5px;
      line-height: 16px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Where should Grouper run?</h1>
    <p class="lead">You can change this later from the Grouper tray icon.</p>

    <form id="setup-form">
      <label class="option">
        <input type="radio" name="mode" value="this_computer" checked>
        <span>
          <span class="option-title">This computer</span>
          <span class="option-desc">Grouper runs here and your other devices connect to it. Pick a computer that stays on.</span>
        </span>
      </label>

      <label class="option">
        <input type="radio" name="mode" value="another_computer">
        <span>
          <span class="option-title">Another computer</span>
          <span class="option-desc">Don't run a hub on this PC; open a hub that is already set up elsewhere.</span>
        </span>
      </label>

      <div id="remote-box" class="remote-box" hidden>
        <label for="remote-url">Hub address</label>
        <input id="remote-url" type="url" autocomplete="off" spellcheck="false" value="https://grouper.clockmillbarn.uk">
        <p class="hint">Defaults to https://grouper.clockmillbarn.uk; changeable later.</p>
      </div>

      <div class="actions">
        <button id="continue-btn" class="primary" type="submit" hidden>Continue</button>
        <button id="google-btn" class="secondary" type="button" hidden>Sign in with Google</button>
      </div>
      <div id="error" role="alert" hidden></div>
      <p id="oauth-note" hidden></p>
    </form>
  </main>

  <script>
    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    const form = document.getElementById("setup-form");
    const remoteBox = document.getElementById("remote-box");
    const remoteInput = document.getElementById("remote-url");
    const continueBtn = document.getElementById("continue-btn");
    const googleBtn = document.getElementById("google-btn");
    const errorEl = document.getElementById("error");
    const oauthNoteEl = document.getElementById("oauth-note");
    let localHubClaimed = false;
    let googleConfigured = false;

    function selectedMode() {
      const checked = form.querySelector('input[name="mode"]:checked');
      return checked ? checked.value : "this_computer";
    }

    function syncVisibility() {
      const thisComputer = selectedMode() === "this_computer";
      remoteBox.hidden = thisComputer;
      // Continue on an unclaimed hub opens a window that cannot be claimed over HTTP.
      const hideContinue = thisComputer && !localHubClaimed;
      continueBtn.hidden = hideContinue;
      googleBtn.classList.toggle("primary", hideContinue);
      googleBtn.classList.toggle("secondary", !hideContinue);
      if (!googleConfigured) {
        oauthNoteEl.hidden = !thisComputer;
      }
    }

    form.addEventListener("change", syncVisibility);

    async function submitChoice(signInWithGoogle) {
      errorEl.hidden = true;
      continueBtn.disabled = true;
      googleBtn.disabled = true;
      try {
        await invoke("choose", {
          mode: selectedMode(),
          remoteHubUrl: remoteInput.value,
          signInWithGoogle: Boolean(signInWithGoogle),
        });
      } catch (err) {
        errorEl.textContent = String(err);
        errorEl.hidden = false;
        continueBtn.disabled = false;
        googleBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (continueBtn.hidden) return;
      submitChoice(false);
    });

    googleBtn.addEventListener("click", () => submitChoice(true));

    (async () => {
      if (!invoke) return;
      try {
        const state = await invoke("setup");
        if (state.mode) {
          const radio = form.querySelector(`input[name="mode"][value="${state.mode}"]`);
          if (radio) radio.checked = true;
        }
        if (state.remote_hub_url) {
          remoteInput.value = state.remote_hub_url;
        }
        localHubClaimed = Boolean(state.local_hub_claimed);
        googleConfigured = Boolean(state.google_desktop_configured);
        if (googleConfigured) {
          googleBtn.hidden = false;
        } else {
          oauthNoteEl.textContent = "Sign in with Google needs GROUPER_GOOGLE_DESKTOP_CLIENT_ID. This computer stays closed until that sign-in claims the hub. The client secret, when Google asks for one, comes from the saved DPAPI setting or GROUPER_GOOGLE_DESKTOP_CLIENT_SECRET.";
        }
        syncVisibility();
      } catch (err) {
        errorEl.textContent = String(err);
        errorEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
