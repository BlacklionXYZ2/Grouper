# Apple apps and the Swift package.
#
# Runner is macos-26, which carries Xcode 26. If that label is unavailable,
# fall back to macos-15 and select the Xcode 26 beta:
#   runs-on: macos-15
#   - uses: maxim-lobanov/setup-xcode@v1
#     with:
#       xcode-version: "26.0-beta"
#
# TODO(iOS XCFramework): scripts/build-apple.sh only `cargo build`s the host
# Mac and copies target/$PROFILE/libgrouper_ffi.a. It does not cross-compile
# aarch64-apple-ios or aarch64-apple-ios-sim, and it does not assemble an
# XCFramework. Do not add those steps here until the script grows them; a
# hand-rolled lipo/xcodebuild -create-xcframework would fail.
# Grouper-iOS (see apple/GrouperApp/project.yml) links the GrouperAPI product
# only, not GrouperKit, so the iOS app build does not need that slice.
# The Rust targets below are installed so the toolchain is ready for that
# later slice. This job builds the host library the script actually produces.

name: Apple

on:
  push:
    paths:
      - "apple/**"
      - "crates/**"
      - "scripts/build-apple.sh"
      # The host library build also reads the workspace manifests.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apple/**"
      - "crates/**"
      - "scripts/build-apple.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: macos-26
    runs-on: macos-26
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build the host Mac library and UniFFI bindings
        run: bash scripts/build-apple.sh

      - name: Show the static library architecture
        run: lipo -info apple/GrouperKit/lib/libgrouper_ffi.a

      - name: Swift package
        working-directory: apple/GrouperKit
        run: |
          swift build
          swift test

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"

      - name: Generate the Xcode project
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          # project.yml declares no schemes. XcodeGen writes a shared scheme
          # only from a target `scheme:` or a top-level `schemes:` map, and
          # xcodebuild cannot resolve the local Swift package without one.
          # Append schemes for this checkout only.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()
          if "\nschemes:" in text or text.startswith("schemes:"):
              raise SystemExit("project.yml already declares schemes; update the CI step")
          if not text.endswith("\n"):
              text += "\n"
          text += """
          schemes:
            Grouper-macOS:
              build:
                targets:
                  Grouper-macOS: all
                buildImplicitDependencies: true
                buildArchitectures: matchRunDestination
            Grouper-iOS:
              build:
                targets:
                  GrouperWidgets: all
                  Grouper-iOS: all
                buildImplicitDependencies: true
                buildArchitectures: matchRunDestination
          """
          path.write_text(text)
          PY
          xcodegen generate
          xcodebuild -project Grouper.xcodeproj -list

      - name: Build the Mac app
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          mkdir -p build-logs
          # Host arch only: build-apple.sh did not build an x86_64 slice.
          # DEVELOPMENT_TEAM in project.yml is empty.
          xcodebuild build \
            -project Grouper.xcodeproj \
            -scheme Grouper-macOS \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-macos.log

      - name: Build the iOS app
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Grouper.xcodeproj \
            -scheme Grouper-iOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-ios.log

      - name: Upload xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: apple/GrouperApp/build-logs/*.log
          if-no-files-found: ignore
