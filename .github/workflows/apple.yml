# Apple apps and the Swift package.
#
# Runner is macos-26, which carries Xcode 26. If that label is unavailable,
# fall back to macos-15 and select the Xcode 26 beta:
#   runs-on: macos-15
#   - uses: maxim-lobanov/setup-xcode@v1
#     with:
#       xcode-version: "26.0-beta"
#
# TODO(iOS XCFramework): scripts/build-apple.sh only `cargo build`s the host
# Mac and copies target/$PROFILE/libgrouper_ffi.a. It does not cross-compile
# aarch64-apple-ios or aarch64-apple-ios-sim, and it does not assemble an
# XCFramework. Do not add those steps here until the script grows them; a
# hand-rolled lipo/xcodebuild -create-xcframework would fail.
# Grouper-iOS (see apple/GrouperApp/project.yml) links the GrouperAPI product
# only, not GrouperKit, so the iOS app build does not need that slice.
# The Rust targets below are installed so the toolchain is ready for that
# later slice. This job builds the host library the script actually produces.

name: Apple

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # Path filters don't apply to tag pushes, so every v* tag builds.
    tags: ["v*"]
    paths:
      - "apple/**"
      - "crates/**"
      - "scripts/build-apple.sh"
      # The host library build also reads the workspace manifests.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/apple.yml"
      - "scripts/publish-release.sh"
  pull_request:
    paths:
      - "apple/**"
      - "crates/**"
      - "scripts/build-apple.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/apple.yml"
      - "scripts/publish-release.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    # GitHub's preview image with macOS 27 and Xcode 27 (macos-26 only has Xcode 26).
    # If it's unavailable, fall back to runs-on: macos-26 (Xcode 26.6).
    name: xcode-27
    runs-on: xcode-27
    permissions:
      contents: write # publish the release
      actions: write
    steps:
      - uses: actions/checkout@v7

      # The apps target macOS 27 and iOS 27 first (the deployment target stays 26),
      # so build with the newest stable Xcode the runner has.
      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build the host Mac library and UniFFI bindings
        run: bash scripts/build-apple.sh

      - name: Show the static library architecture
        run: lipo -info apple/GrouperKit/lib/libgrouper_ffi.a

      - name: Swift package
        working-directory: apple/GrouperKit
        run: |
          swift build
          swift test

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"

      - name: Generate the Xcode project
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Grouper.xcodeproj -list

      - name: Build the Mac app
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          mkdir -p build-logs
          # Host arch only: build-apple.sh did not build an x86_64 slice.
          # DEVELOPMENT_TEAM in project.yml is empty.
          xcodebuild build \
            -project Grouper.xcodeproj \
            -scheme Grouper-macOS \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-macos.log

      # A downloadable Mac app (Apple Silicon, debug build). Ad-hoc signed, not
      # notarized: after unzipping, run `xattr -dr com.apple.quarantine Grouper.app`
      # or use System Settings > Privacy & Security > Open Anyway. See the README.
      - name: Package the Mac app
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          app="$(find build/dd/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$app"
          echo "Packaging $app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/Grouper-macOS-arm64.zip

      - name: Upload the Mac app
        uses: actions/upload-artifact@v7
        with:
          name: Grouper-macOS-arm64
          path: apple/GrouperApp/dist/Grouper-macOS-arm64.zip
          retention-days: 14

      - name: Publish to GitHub release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/harness' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh apple/GrouperApp/dist/Grouper-macOS-arm64.zip Grouper-macOS-arm64.zip "Mac app, Apple Silicon"

      - name: Build the iOS app
        working-directory: apple/GrouperApp
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Grouper.xcodeproj \
            -scheme Grouper-iOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-ios.log

      - name: Upload xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: apple/GrouperApp/build-logs/*.log
          if-no-files-found: ignore
