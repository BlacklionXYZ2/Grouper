[package]
name = "core-protocol"
description = "Wire protocol shared by the Grouper hub and every client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The MCP tunnel: an rmcp transport over the connection's frames (hub and devices).
tunnel = ["dep:rmcp", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, optional = true, features = ["client"] }
tokio = { workspace = true, optional = true }
