[package]
name = "core-client"
description = "Grouper device connection: hello, presence, keep-alive, reconnects and tool dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-protocol = { workspace = true, features = ["tunnel"] }
core-agent.workspace = true
providers.workspace = true
async-trait.workspace = true
base64 = "0.22"
dirs = "6"
futures-util.workspace = true
# Same version rmcp's child-process transport uses; adds killing the whole process tree.
process-wrap = { version = "10", features = ["tokio1", "job-object", "process-group", "kill-on-drop"] }
rmcp = { workspace = true, features = ["server", "client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
