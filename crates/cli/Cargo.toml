[package]
name = "grouper-cli"
description = "Grouper command-line client: connect this machine as a device, list devices, call tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "grouper"
path = "src/main.rs"

[dependencies]
core-client.workspace = true
core-sync.workspace = true
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
dirs = "6"
reqwest.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
