<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Grouper mark">
  <defs>
    <!-- Centre grouper gradients -->
    <linearGradient id="big-head-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#58ece2"/>
      <stop offset="55%" stop-color="#30d9d8"/>
      <stop offset="100%" stop-color="#1fc6cd"/>
    </linearGradient>
    <linearGradient id="big-body-grad" x1="50%" y1="18%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#14a8c5"/>
      <stop offset="36%" stop-color="#0b8bb9"/>
      <stop offset="72%" stop-color="#0c70b2"/>
      <stop offset="100%" stop-color="#1a76ba"/>
    </linearGradient>
    <linearGradient id="big-body-shade" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#08447d" stop-opacity="0.22"/>
      <stop offset="18%" stop-color="#1aa9c9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#32d4de" stop-opacity="0.06"/>
      <stop offset="82%" stop-color="#1aa9c9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08447d" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="pec-left-grad" x1="0%" y1="40%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#48e8e4"/>
      <stop offset="52%" stop-color="#1ac5d3"/>
      <stop offset="100%" stop-color="#0c84ad"/>
    </linearGradient>
    <linearGradient id="pec-right-grad" x1="0%" y1="40%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#35dce0"/>
      <stop offset="52%" stop-color="#14b2ca"/>
      <stop offset="100%" stop-color="#0a75a3"/>
    </linearGradient>
    <linearGradient id="pelvic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b7ec0"/>
      <stop offset="100%" stop-color="#125ca0"/>
    </linearGradient>

    <!-- School fish colour gradients -->
    <linearGradient id="grad-top-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#52e4dc"/>
      <stop offset="100%" stop-color="#28c5cc"/>
    </linearGradient>
    <linearGradient id="grad-top-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3eddd7"/>
      <stop offset="100%" stop-color="#1ec0c9"/>
    </linearGradient>
    <linearGradient id="grad-mid-outer-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#32ced8"/>
      <stop offset="100%" stop-color="#1096bf"/>
    </linearGradient>
    <linearGradient id="grad-mid-outer-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#28bae0"/>
      <stop offset="100%" stop-color="#147dd4"/>
    </linearGradient>
    <linearGradient id="grad-mid-inner-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#36d7dc"/>
      <stop offset="100%" stop-color="#10a0c2"/>
    </linearGradient>
    <linearGradient id="grad-mid-inner-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#24b3e0"/>
      <stop offset="100%" stop-color="#1870d4"/>
    </linearGradient>
    <linearGradient id="grad-low-inner-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2099dd"/>
      <stop offset="100%" stop-color="#166cc8"/>
    </linearGradient>
    <linearGradient id="grad-low-inner-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1c84da"/>
      <stop offset="100%" stop-color="#165dc8"/>
    </linearGradient>
    <linearGradient id="grad-low-outer-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2cd0d7"/>
      <stop offset="100%" stop-color="#11a2be"/>
    </linearGradient>
    <linearGradient id="grad-low-outer-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8740f6"/>
      <stop offset="55%" stop-color="#702de6"/>
      <stop offset="100%" stop-color="#5821cc"/>
    </linearGradient>
    <linearGradient id="grad-bot-inner-left" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#604bf2"/>
      <stop offset="60%" stop-color="#523ae5"/>
      <stop offset="100%" stop-color="#482fd4"/>
    </linearGradient>
    <linearGradient id="grad-bot-inner-right" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7e37f0"/>
      <stop offset="60%" stop-color="#6828dd"/>
      <stop offset="100%" stop-color="#5420c4"/>
    </linearGradient>

    <!-- Centre fish reusable geometry -->
    <path id="big-body" d="
      M 512 96
      C 540 100, 586 146, 606 208
      C 618 248, 624 292, 624 350
      C 624 422, 610 484, 586 544
      C 564 598, 540 644, 536 690
      C 534 722, 560 766, 572 812
      C 580 842, 574 880, 546 916
      C 532 894, 521 870, 512 850
      C 503 870, 492 894, 478 916
      C 450 880, 444 842, 452 812
      C 464 766, 490 722, 488 690
      C 484 644, 460 598, 438 544
      C 414 484, 400 422, 400 350
      C 400 292, 406 248, 418 208
      C 438 146, 484 100, 512 96 Z"/>
    <clipPath id="big-body-clip">
      <use href="#big-body"/>
    </clipPath>
    <path id="big-pectoral" d="
      M 388 318
      C 360 350, 336 400, 338 442
      C 339 456, 344 464, 350 462
      C 362 454, 376 438, 390 428
      C 387 392, 386 354, 388 318 Z"/>
    <path id="big-pelvic" d="
      M 444 536
      C 428 560, 422 590, 427 616
      C 429 628, 436 629, 442 621
      C 450 610, 458 596, 466 584 Z"/>

    <!-- Reusable school fish templates -->
    <g id="fish-school">
      <path d="
        M 0 -98
        C 16 -76, 30 -42, 31 -6
        C 35 6, 35 18, 30 28
        C 27 23, 25 19, 24 16
        C 19 38, 12 56, 8 72
        C 11 81, 13 89, 9 97
        C 4 93, 2 89, 0 86
        C -2 89, -4 93, -9 97
        C -13 89, -11 81, -8 72
        C -12 56, -19 38, -24 16
        C -25 19, -27 23, -30 28
        C -35 18, -35 6, -31 -6
        C -30 -42, -16 -76, 0 -98 Z"/>
      <circle cx="-2" cy="-68" r="3.8" fill="#07152c"/>
    </g>

    <g id="fish-arc">
      <path d="
        M 7 -98
        C 23 -74, 34 -38, 32 -2
        C 35 10, 33 21, 27 29
        C 24 23, 22 19, 20 15
        C 13 38, 5 54, -1 68
        C 4 79, 6 89, 2 98
        C -3 94, -7 89, -10 86
        C -14 90, -19 94, -24 96
        C -25 86, -19 76, -14 66
        C -18 48, -23 30, -25 10
        C -27 14, -29 17, -31 19
        C -34 10, -33 -4, -28 -18
        C -23 -52, -8 -80, 7 -98 Z"/>
      <circle cx="1" cy="-70" r="3.8" fill="#07152c"/>
    </g>

    <g id="fish-sleek">
      <path d="
        M 4 -98
        C 21 -74, 32 -36, 30 2
        C 28 34, 15 62, 1 82
        C 0 90, -2 97, -7 101
        C -12 94, -14 84, -12 72
        C -20 48, -28 20, -28 -12
        C -28 -48, -12 -78, 4 -98 Z"/>
      <circle cx="0" cy="-70" r="3.6" fill="#07152c"/>
    </g>

    <g id="fish-outer-low">
      <path d="
        M -4 -102
        C 16 -78, 33 -42, 35 -4
        C 39 8, 38 19, 33 28
        C 30 23, 28 19, 26 15
        C 21 42, 14 66, 9 82
        C 11 90, 10 97, 5 102
        C 0 98, -3 94, -5 91
        C -8 94, -11 96, -14 98
        C -15 88, -11 78, -9 68
        C -18 48, -26 26, -29 6
        C -32 10, -34 14, -36 18
        C -39 8, -38 -6, -34 -20
        C -30 -54, -18 -82, -4 -102 Z"/>
      <circle cx="-6" cy="-72" r="4.0" fill="#07152c"/>
    </g>

    <path id="fish-minnow" d="
      M 2 -72
      C 14 -48, 21 -22, 19 4
      C 17 28, 7 50, -2 72
      C -5 54, -8 42, -12 30
      C -18 14, -21 -4, -19 -22
      C -17 -44, -9 -60, 2 -72 Z"/>
  </defs>

  <!-- Fish school composition (transparent background) -->
  <g id="grouper-school">
    <!-- Left school (6 fish) -->
    <use href="#fish-arc" fill="url(#grad-top-left)"
         transform="translate(242, 290) rotate(36) scale(1.00, 0.96)"/>
    <use href="#fish-sleek" fill="url(#grad-mid-outer-left)"
         transform="translate(132, 448) rotate(11) scale(0.84, 0.87)"/>
    <use href="#fish-school" fill="url(#grad-mid-inner-left)"
         transform="translate(256, 496) rotate(4) scale(0.97, 1.01)"/>
    <use href="#fish-minnow" fill="url(#grad-low-inner-left)"
         transform="translate(328, 616) rotate(8) scale(0.98, 0.98)"/>
    <use href="#fish-outer-low" fill="url(#grad-low-outer-left)"
         transform="translate(186, 652) rotate(-13) scale(1.13, 1.12)"/>
    <use href="#fish-sleek" fill="url(#grad-bot-inner-left)"
         transform="translate(324, 758) scale(-1, 1) rotate(15) scale(0.95, 0.88)"/>

    <!-- Right school (6 fish, mirror-symmetric placement) -->
    <use href="#fish-arc" fill="url(#grad-top-right)"
         transform="translate(782, 290) scale(-1, 1) rotate(36) scale(1.00, 0.96)"/>
    <use href="#fish-sleek" fill="url(#grad-mid-outer-right)"
         transform="translate(892, 448) scale(-1, 1) rotate(11) scale(0.84, 0.87)"/>
    <use href="#fish-school" fill="url(#grad-mid-inner-right)"
         transform="translate(768, 496) scale(-1, 1) rotate(4) scale(0.97, 1.01)"/>
    <use href="#fish-minnow" fill="url(#grad-low-inner-right)"
         transform="translate(696, 616) scale(-1, 1) rotate(8) scale(0.98, 0.98)"/>
    <use href="#fish-outer-low" fill="url(#grad-low-outer-right)"
         transform="translate(838, 652) scale(-1, 1) rotate(-13) scale(1.13, 1.12)"/>
    <use href="#fish-sleek" fill="url(#grad-bot-inner-right)"
         transform="translate(700, 758) rotate(15) scale(0.95, 0.88)"/>

    <!-- Centre grouper -->
    <g id="centre-fish">
      <use href="#big-pelvic" fill="url(#pelvic-grad)"/>
      <use href="#big-pelvic" fill="url(#pelvic-grad)" transform="translate(1024, 0) scale(-1, 1)"/>
      <use href="#big-pectoral" fill="url(#pec-left-grad)"/>
      <use href="#big-pectoral" fill="url(#pec-right-grad)" transform="translate(1024, 0) scale(-1, 1)"/>
      <use href="#big-body" fill="url(#big-body-grad)"/>
      <use href="#big-body" fill="url(#big-body-shade)"/>
      <path clip-path="url(#big-body-clip)" fill="url(#big-head-grad)" d="
        M 390 88
        H 634
        V 298
        C 596 312, 548 278, 522 256
        C 515 250, 509 250, 502 256
        C 476 278, 428 312, 390 298 Z"/>
      <circle cx="468" cy="168" r="9.6" fill="#07152c"/>
      <circle cx="556" cy="168" r="9.6" fill="#07152c"/>
    </g>
  </g>
</svg>
