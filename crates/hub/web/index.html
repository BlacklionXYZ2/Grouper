<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Grouper</title>
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
<script type="module" src="/app/app.js"></script>
</head>
<body>
<div id="app" class="boot" aria-busy="true">
  <div class="boot-mark" aria-hidden="true"></div>
  <p class="boot-text">Loading Grouper…</p>
</div>
<div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="alert-region" class="visually-hidden" role="alert" aria-live="assertive"></div>

</html>
